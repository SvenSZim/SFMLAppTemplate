name: Bug
description: Something behaves differently from what the plan, the docs or the tests say
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happens
      description: Include the exact error text or a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, compiler and version, commit.
