name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packages SFML needs for its Graphics module on Linux. Keep in sync with README.md.
  SFML_PACKAGES: >-
    libx11-dev libxrandr-dev libxcursor-dev libxi-dev
    libudev-dev libgl1-mesa-dev libfreetype-dev
  # Virtual display and software OpenGL, for the tests that open a window.
  DISPLAY_PACKAGES: xvfb libgl1-mesa-dri
  # Compiler outputs kept between runs, so that a run compiles only what changed (SFML, Catch2
  # and our own files alike).
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install clang-format==23.1.2
      - name: Check formatting
        run: tools/format.sh --check

  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reference build: what users get.
          - name: GCC, release
            cache: gcc-release # names the compiler cache; cache keys cannot contain commas
            cxx: g++
            cc: gcc
            build_type: Release
            sanitize: ""
            display_tests: true
          # A second compiler, with memory and undefined-behaviour checks on the template's own code.
          - name: Clang, debug, sanitizers
            cache: clang-sanitizers
            cxx: clang++
            cc: clang
            build_type: Debug
            sanitize: address,undefined
            display_tests: false
          # Data races, in the code that is shared between threads.
          - name: GCC, debug, ThreadSanitizer
            cache: gcc-tsan
            cxx: g++
            cc: gcc
            build_type: Debug
            sanitize: thread
            display_tests: false
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $SFML_PACKAGES $DISPLAY_PACKAGES ccache

      # One cache per job, since compiler and flags differ. Every run saves its own (keys cannot
      # be overwritten) and starts from the newest one; a pull request also finds main's.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.cache }}-

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DATPL_WARNINGS_AS_ERRORS=ON
          -DATPL_SANITIZE=${{ matrix.sanitize }}

      # As many compile jobs as the runner has cores, not more: without a number, `--parallel`
      # means `make -j` without a limit, and compiling everything at once ran the ThreadSanitizer
      # build out of memory (it was killed with exit code 143).
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats

      # Saved also when the build failed: what did compile need not be compiled again.
      - name: Save compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ThreadSanitizer cannot start with the address randomisation of recent kernels.
      - name: Reduce address randomisation
        if: ${{ matrix.sanitize == 'thread' }}
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Test
        if: ${{ !matrix.display_tests }}
        run: ctest --test-dir build --output-on-failure -LE display

      - name: Test (with virtual display)
        if: ${{ matrix.display_tests }}
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure

  # Portability check only (decision P9): Windows is not a supported platform, so a failure here
  # is reported but never blocks a merge. It runs on every pull request (WP 7.5, D78).
  windows:
    name: Windows (MSVC, informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # The compiler's environment, so that Ninja finds cl.exe: the Visual Studio generator
      # cannot compile through ccache.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache
        run: choco install ccache --no-progress -y

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-msvc-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DATPL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats

      - name: Save compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-msvc-${{ github.run_id }}-${{ github.run_attempt }}

      # Windows runners have no graphics card, only basic OpenGL: the tests that open a window or
      # draw are left out.
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE display
